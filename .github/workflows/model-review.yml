name: Model review

on:
  pull_request:
  workflow_dispatch:
    inputs:
      manifest:
        description: Candidate manifest path (optional until Base is approved)
        required: false
        type: string

permissions:
  contents: read

jobs:
  deterministic-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate infrastructure
        run: |
          python -m compileall scripts tests
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run candidate QA when requested
        if: ${{ inputs.manifest != '' }}
        run: python scripts/run_regression.py --manifest "${{ inputs.manifest }}" --output reports/test-report.json
      - name: Run Task C independent QA when present
        if: ${{ hashFiles('scenarios/TASK-C-PATH-10M/task-c-path-to-10m-v1.xlsx') != '' }}
        run: python scripts/run_task_c_qa.py
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-review-reports
          path: reports/
          if-no-files-found: warn
